# Producción. Coolify usa este archivo y le pone el dominio al servicio web.
# El navegador habla con web; Next reenvía /api al servicio api.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SQLITE_PATH: /data/overrides.sqlite
    volumes:
      - overrides:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  overrides:
