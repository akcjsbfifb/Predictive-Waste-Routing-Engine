# Local. Mismos nombres de servicio que compose.yaml, con el código montado.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: dev
    command: ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "backend"]
    ports:
      - "8000:8000"
    environment:
      SQLITE_PATH: /data/overrides.sqlite
    volumes:
      - .:/app
      - overrides:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: dev
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  overrides:
  web_node_modules:
